[package]
name = "agyfast-rs"
version = "0.1.1"
edition = "2024"
description = "Fast batched code navigation, edits and checks for Antigravity and Claude Code"
license = "MIT"

[dependencies]
globset = "0.4.22"
grep-matcher = "0.1.10"
grep-regex = "0.1.15"
grep-searcher = "0.1.18"
ignore = "0.4.35"
libc = "0.2.191"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.2.3"
tree-sitter = "0.27.2"
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-toml-ng = { version = "0.7.0", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-yaml = { version = "0.7.2", optional = true }
wait-timeout = "0.2.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[features]
default = ["lang-rust", "lang-ts", "lang-python", "lang-go", "lang-config"]
lang-rust = ["dep:tree-sitter-rust"]
lang-ts = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
lang-python = ["dep:tree-sitter-python"]
lang-go = ["dep:tree-sitter-go"]
lang-config = ["dep:tree-sitter-json", "dep:tree-sitter-toml-ng", "dep:tree-sitter-yaml"]
