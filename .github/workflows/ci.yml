name: ci

# Tests and clippy on every platform we ship, so a platform break shows up before a release tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy
      - name: Crate and plugin versions match
        shell: bash
        run: v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1) && grep -q "\"version\": \"$v\"" plugin/plugin.json
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Installer smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target\release | Out-Null
          Copy-Item target\debug\agyfast-rs.exe target\release\agyfast-rs.exe -Force
          .\install.ps1 -SkipBuild
          & "$env:USERPROFILE\.local\bin\agyfast-rs.exe" --version
