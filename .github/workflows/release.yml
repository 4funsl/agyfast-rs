name: release

# Push a tag like v0.1.0 to build the binaries and publish a GitHub release.
on:
  push:
    tags: ["v*"]

# Build jobs run third-party build scripts: read-only token, no stored credentials.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, test: true }
          - { os: macos-latest, target: x86_64-apple-darwin, test: false }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, test: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - name: Test
        if: matrix.test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="agyfast-rs-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp -R plugin claude install.sh install.ps1 LICENSE README.md "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/agyfast-rs.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/agyfast-rs" "$name/"
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            agyfast-rs-*.tar.gz
            agyfast-rs-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum agyfast-rs-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "agyfast-rs $GITHUB_REF_NAME" --generate-notes agyfast-rs-* SHA256SUMS
