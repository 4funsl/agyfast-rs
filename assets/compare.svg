<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Same task in plain Antigravity, with agy-fast and with agyfast-rs: weighted tokens 273k, 238k, 207k; LLM turns 25, 20, 16; wall time 184, 151, 146 seconds; tokens added per session none, about 4,800, about 2,700">
